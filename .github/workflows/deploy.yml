name: Deploy

# Every push to main redeploys https://team2.gdgoc-devfest.org on Dokploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS -X POST https://platform.gdgoc-devfest.org/api/application.deploy
          -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" -H "Content-Type: application/json"
          -d '{"applicationId":"${{ vars.DOKPLOY_APPLICATION_ID }}"}'
