name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:push
      - run: npm run db:seed
      - run: npm run build

# ---------------------------------------------------------------------------
# To enable CI, move this file to .github/workflows/ci.yml and push.
# (It lives here because the token used for the first push lacked the
#  `workflow` permission that GitHub requires for creating workflow files.)
# ---------------------------------------------------------------------------
